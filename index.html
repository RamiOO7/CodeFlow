<style>
:root,[data-theme=light]{--bg:#f5f0ff;--cd:#fff;--tx:#241a4a;--mu:#7d72a8;--ac:#7c5cff;--act:#fff;--bd:#e3d9ff;--ok:#b9f3d6;--no:#ffc7d1;--pk:#ffd6f0}
[data-theme=dark]{--bg:#0e0a1f;--cd:#1a1433;--tx:#f3eeff;--mu:#9a8fc4;--ac:#9b7bff;--act:#fff;--bd:#2d2457;--ok:#1f5c45;--no:#6b2a3d;--pk:#3a1f5c}
[data-theme=green]{--bg:#eafff6;--cd:#fff;--tx:#0d3b34;--mu:#5f9a8e;--ac:#14b88a;--act:#fff;--bd:#c6f2e3;--ok:#b9f3d6;--no:#ffd0d0;--pk:#d4fbe9}
[data-theme=blue]{--bg:#eaf4ff;--cd:#fff;--tx:#10264d;--mu:#6785b0;--ac:#2f7bff;--act:#fff;--bd:#cfe2fb;--ok:#bdf0dd;--no:#ffd0d0;--pk:#d8e8ff}
[data-theme=bw]{--bg:#fff3ea;--cd:#fff;--tx:#4a1f1a;--mu:#b0807a;--ac:#ff6a3d;--act:#fff;--bd:#ffd9c6;--ok:#c8f2d6;--no:#ffc7c7;--pk:#ffe0d0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer}[hidden]{display:none!important}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#m{flex:1;overflow:auto;padding:16px}
#nv{display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#nv button{flex:1;border:0;background:none;color:var(--mu);padding:8px;font-size:20px}#nv .on{color:var(--tx);font-weight:700}#nv small{display:block;font-size:11px}
h1,h2,h3{margin:.3em 0}.mu{color:var(--mu)}
.in{width:100%;padding:14px;border:2px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font-size:16px}
.b{display:block;width:100%;background:var(--ac);color:var(--act);border:0;border-radius:14px;padding:14px;font-weight:700;margin:8px 0}.b:disabled{opacity:.4}
.g{display:block;width:100%;background:none;color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.ft{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.lg{border:2px solid var(--bd);background:var(--cd);border-radius:16px;padding:14px;text-align:center;font-weight:600}.lg b{display:block;font-size:30px}.lg small{display:block;color:var(--mu);font-weight:400}.soon{opacity:.45}
.sel{border-color:#4a90ff!important;box-shadow:0 0 0 3px rgba(74,144,255,.25)}
.ex{display:block;width:100%;text-align:left;margin:8px 0;padding:16px}
.sb{background:var(--pk);border-radius:14px;padding:10px 14px;font-weight:700;margin-top:18px}
.nw{text-align:center;margin:14px 0}.nl{font-weight:600;margin-top:6px;font-size:14px}.nl small{display:block;color:var(--mu);font-weight:400}
.nd{width:68px;height:68px;border-radius:50%;border:0;background:var(--ac);color:var(--act);font-size:28px;box-shadow:0 5px 0 rgba(0,0,0,.12);position:relative}
.nd.dn{background:var(--ok)}.nd.dn::after{content:'✓';position:absolute;right:-4px;top:-4px;font-size:12px;background:var(--cd);color:var(--tx);border:1px solid var(--bd);border-radius:50%;width:22px;height:22px;line-height:20px}
.nd.lk{background:var(--bd);opacity:.6}.nd.cu{outline:5px solid var(--pk)}
#ov{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.oc{max-width:520px;margin:0 auto;padding:56px 16px 24px;position:relative}.x{position:absolute;top:12px;left:12px;border:0;background:var(--cd);color:var(--tx);border-radius:50%;width:36px;height:36px}
.op{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:14px}
.op.good{background:var(--ok);border-color:#5fbf93}.op.bad{background:var(--no);border-color:#e57373}
.tm{background:#12141c;color:#d8ffd8;border-radius:14px;padding:12px;font:14px ui-monospace,Menlo,monospace}.tm textarea{width:100%;min-height:140px;background:none;border:0;color:inherit;font:inherit;outline:0}.tm pre{margin:6px 0 0;white-space:pre-wrap}
.ctr{text-align:center}.big{font-size:64px}
.bb{background:var(--cd);border:1px solid var(--bd);padding:10px 12px;border-radius:14px;margin:8px 0;max-width:85%}.bb.u{background:var(--ac);color:var(--act);margin-left:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}.rw{display:flex;justify-content:space-between;align-items:center}
.chip{border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:8px 12px;margin:6px 6px 0 0}
.row{display:flex;gap:8px}.sn{width:52px;border:0;border-radius:14px;background:var(--ac);color:var(--act)}
body{background:radial-gradient(circle at 15% 0,color-mix(in srgb,var(--ac) 25%,var(--bg)),var(--bg) 60%) fixed}
.b{background:linear-gradient(135deg,var(--ac),#ff7ac6);box-shadow:0 8px 20px rgba(124,92,255,.35);border-radius:18px}
.nd{background:linear-gradient(135deg,var(--ac),#ff7ac6)}.nd.dn{background:var(--ok)}.nd.lk{background:var(--bd)}
.lg,.cd,.op,.chip{border-radius:20px}.sb{background:linear-gradient(90deg,var(--ac),#ff7ac6);color:#fff}
#m{padding-bottom:120px}
#nv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(86%,340px);border:1px solid var(--bd);border-radius:34px;padding:6px;gap:4px;background:color-mix(in srgb,var(--cd) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 32px rgba(90,50,220,.3);z-index:5}
#nv button{border-radius:28px;transition:.3s;padding:9px}#nv .on{background:linear-gradient(135deg,var(--ac),#ff7ac6);color:#fff;transform:scale(1.06)}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#2a1466,#7c5cff 55%,#ff7ac6);color:#fff;transition:opacity .6s,visibility .6s}#sp.out{opacity:0;visibility:hidden}
#sp h1{font-size:40px;margin:14px 0 0;animation:up .8s .3s both}#sp p{opacity:.85;margin:6px;animation:up .8s .6s both}
.lo{font:800 40px ui-monospace,monospace;background:#fff;color:#7c5cff;width:96px;height:96px;border-radius:30px;display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .8s both;box-shadow:0 12px 40px rgba(0,0,0,.3)}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:0}to{opacity:1}}
</style></head><body><div id=sp><div class=lo>{ }</div><h1>CodeFlow</h1><p>Aprende a programar</p></div><div id="app"><main id="m"></main><nav id="nv"></nav></div><div id="ov" hidden></div>
<script>
/* CodeFlow - Copyright (c) 2026 RamiOO7 - MIT License */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={theme:'dark',prog:{},step:1,exp:1,langs:[]},C={},T=0,tut=0,xs,dip,L,am=0,ae="";
{let u=localStorage.cfs;if(u)Object.assign(S,JSON.parse(localStorage["cs_"+u]||"{}"),{user:u})}
setTimeout(()=>$("#sp").classList.add("out"),1700);
const save=()=>{if(S.user)localStorage["cs_"+S.user]=JSON.stringify(S)};
const LG=[["python","Python","🐍"],["javascript","JavaScript","🟨"],["java","Java","☕"],["c","C","⚙️"],["cpp","C++","➕",1],["csharp","C#","🎯",1],["ts","TypeScript","🔷",1],["go","Go","🐹",1],["rust","Rust","🦀",1],["php","PHP","🐘",1],["kotlin","Kotlin","🟣",1],["swift","Swift","🕊️",1]];
const TH=[['dark','Noche'],['light','Lavanda'],['green','Esmeralda'],['blue','Océano'],['bw','Atardecer']];
const INTRO={id:'i',n:'¿Qué es programar?',i:'💡',t:'Un programa es una lista de instrucciones que el ordenador sigue en orden. Programar es escribirlas. Aprenderás paso a paso.',q:["¿Qué es un programa?|Una lista de instrucciones|Un dibujo|Un cable|0","¿En qué orden se ejecuta?|De arriba abajo|Al azar|De abajo arriba|0"]};
const pr=()=>S.prog[S.lang]||(S.prog[S.lang]={});
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const pq=s=>{let p=s.split('|'),i=+p.pop(),q=p.shift();return{q,c:p[i],o:shuf(p)}};
async function load(l){if(!C[l])C[l]=await (await fetch('l/'+l+'.json')).json();return C[l]}
function th(){document.documentElement.dataset.theme=S.theme;$('meta[name=theme-color]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}
function R(){th();let m=$('#m'),nv=$('#nv');
 if(!S.user){nv.style.display='none';return auth(m)}
 if(!S.ok){nv.style.display='none';return onb(m)}
 nv.style.display='flex';
 nv.innerHTML=[['🗺️','Camino'],['⚙️','Ajustes']].map((x,i)=>`<button class="${T==i?'on':''}" onclick="T=${i};R()">${x[0]}<small>${x[1]}</small></button>`).join('');
 [path,aj][T](m)}
function onb(m){let s=S.step,f=(on,fn,t)=>`<div class=ft><button class=b id=nx onclick="${fn}" ${on?'':'disabled'}>${t||'Continuar'}</button></div>`;
 if(s==0)m.innerHTML=`<h1>¡Hola! 👋</h1><p class=mu>¿Cómo te llamas?</p><input id=nm class=in placeholder="Tu nombre" value="${esc(S.name||'')}" oninput="$('#nx').disabled=!this.value.trim()">`+f(S.name,"S.name=$('#nm').value.trim();S.step=1;save();R()");
 else if(s==1)m.innerHTML=`<h1>¿Qué quieres aprender?</h1><p class=mu>Puedes elegir varios.</p><div class=gr>${LG.map(l=>`<div class="lg ${S.langs.includes(l[0])?'sel':''} ${l[3]?'soon':''}" ${l[3]?'':`onclick="tg('${l[0]}');R()"`}><b>${l[2]}</b>${l[1]}${l[3]?'<small>Pronto</small>':''}</div>`).join('')}</div>`+f(S.langs.length,"S.lang=S.langs[0];S.step=2;save();load(S.lang);R()");

 else if(s==2)m.innerHTML=`<h1>¿Cuánta experiencia tienes?</h1>`+[["🌱 Nunca he programado",0],["🌿 Sé algo",1],["🌳 Tengo experiencia",2]].map(x=>`<div class="lg ex ${xs===x[1]?'sel':''}" onclick="xs=${x[1]};R()">${x[0]}</div>`).join('')+f(xs!=null,"S.exp=xs;S.step=3;tut=0;save();R()");
 else{let t=["🗺️|Sigue el camino|Cada círculo es una lección. El icono te dice de qué va la siguiente.","⌨️|Teoría y práctica|Responde preguntas y programa en una terminal dentro de la lección.","🏆|Exámenes y notas|Al acabar una etapa hay examen. Si no llegas a 7, reintenta sin límite."][tut];t=t.split('|');
  m.innerHTML=`<div class=ctr style="padding-top:12vh"><div class=big>${t[0]}</div><h1>${t[1]}</h1><p class=mu>${t[2]}</p></div>`+f(1,tut<2?"tut++;R()":"S.ok=1;save();R()",tut<2?'Continuar':'¡Empezar!')}}
function nodes(){let c=C[S.lang],a=[];if(S.exp==0)a.push({...INTRO,sn:'Introducción'});
 c.forEach((s,si)=>{s.ls.forEach((l,li)=>a.push({...l,id:si+'.'+li,sn:li?0:'Etapa '+(si+1)+': '+s.n}));a.push({id:si+'.e',n:'Examen',i:'🏆',ex:1,q:s.ls.flatMap(l=>l.q)})});return a}
function path(m){if(!C[S.lang]){m.innerHTML='<p class=mu>Descargando lecciones…</p>';load(S.lang).then(R).catch(()=>m.innerHTML='<p class=mu>Sin conexión. Conéctate una vez para descargar este lenguaje.</p>');return}
 let P=pr();if(S.exp==2&&!P.adv){P.adv=1;C[S.lang][0].ls.forEach((l,i)=>P['0.'+i]=100);P['0.e']=100;save()}
 let N=nodes(),f=N.findIndex(n=>P[n.id]==null),lg=LG.find(l=>l[0]==S.lang),h=`<h2>Hola, ${esc(S.name)} ${lg[2]}</h2>`;
 N.forEach((n,k)=>{if(n.sn)h+=`<div class=sb>${esc(n.sn)}</div>`;let d=P[n.id]!=null,lk=f>=0&&k>f;
  h+=`<div class=nw style="transform:translateX(${[0,44,64,44,0,-44,-64,-44][k%8]}px)"><button class="nd ${d?'dn':''} ${k==f?'cu':''} ${lk?'lk':''}" onclick="go(${k})">${n.i}</button><div class=nl>${esc(n.n)}<small>${n.ex?'Examen':n.p?'Práctica':'Lección'}${d?' · '+(P[n.id]/10).toFixed(1):''}</small></div></div>`});
 m.innerHTML=h}
function go(k){let N=nodes(),P=pr(),f=N.findIndex(n=>P[n.id]==null);if(f>=0&&k>f)return;lesson(N[k])}
function ov(h){let o=$('#ov');o.hidden=false;o.innerHTML=`<div class=oc><button class=x onclick="cl()">✕</button>${h}</div>`}
function cl(){$('#ov').hidden=true;R()}
function lesson(n){L={n,qs:shuf(n.q).slice(0,5).map(pq),i:0,ok:0};n.ex?Q():ov(`<h2>${n.i} ${esc(n.n)}</h2><p>${esc(n.t)}</p><button class=b onclick="Q()">Empezar</button>`)}
function Q(){if(L.i>=L.qs.length)return fin();let q=L.qs[L.i];ov(`<small class=mu>${L.i+1}/${L.qs.length}</small><h3>${esc(q.q)}</h3>`+q.o.map((o,j)=>`<button class=op onclick="A(${j},this)">${esc(o)}</button>`).join('')+`<div id=fb></div>`)}
function A(j,b){let q=L.qs[L.i],r=q.o[j]==q.c;if(r)L.ok++;document.querySelectorAll('.op').forEach(x=>{x.disabled=1;if(x.textContent==q.c)x.classList.add('good')});if(!r)b.classList.add('bad');$('#fb').innerHTML=`<button class=b onclick="L.i++;Q()">Siguiente</button>`}
function fin(){L.sc=Math.round(L.ok/L.qs.length*100);L.sc>=70&&L.n.p?term():res()}
function term(){let p=L.n.p;ov(`<h3>⌨️ Práctica</h3><p>${esc(p.t)}</p><div class=tm><div>$ ${S.lang}</div><textarea id=cd spellcheck=false autocapitalize=off autocomplete=off placeholder="Escribe tu código…"></textarea><pre id=out></pre></div><button class=b onclick="run()">▶ Ejecutar</button>${S.exp<2?`<button class=g onclick="$('#out').textContent='💡 '+L.n.p.h">💡 Pista</button>`:''}<div id=fb></div>`)}
function run(){let ok=new RegExp(L.n.p.r).test($('#cd').value);$('#out').textContent=ok?'✓ Programa ejecutado correctamente':'✗ Error: revisa la sintaxis';$('#fb').innerHTML=ok?`<button class=b onclick="res()">Terminar</button>`:''}
function res(){let n=L.n,sc=L.sc,ps=sc>=70,P=pr();
 if(ps){P[n.id]=Math.max(P[n.id]||0,sc);save();if(S.notif&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('CodeFlow','¡Completaste: '+n.n+'!'))}
 ov(`<div class=ctr><div class=big>${ps?'🎉':'💪'}</div><h2>Nota: ${(sc/10).toFixed(1)}/10</h2><p class=mu>${ps?'¡Muy bien! Sigues adelante.':'Aún no llegas al 7. Inténtalo otra vez, sin límite.'}</p>${ps?`<button class=b onclick="cl()">Continuar</button>`:`<button class=b onclick="lesson(L.n)">Volver a intentarlo</button>`}</div>`)}
function aj(m){m.innerHTML=`<h2>⚙️ Ajustes</h2><div class=cd><b>Tema</b><div>${TH.map(t=>`<button class="chip ${S.theme==t[0]?'sel':''}" onclick="S.theme='${t[0]}';save();R()">${t[1]}</button>`).join('')}</div></div><div class=cd><b>Lenguajes que estudio</b><div>${LG.filter(l=>!l[3]).map(l=>`<button class="chip ${S.langs.includes(l[0])?'sel':''}" onclick="tg('${l[0]}');R()">${l[2]} ${l[1]}</button>`).join('')}</div><b style="display:block;margin-top:14px">Lenguaje actual</b><div>${S.langs.map(x=>{let l=LG.find(k=>k[0]==x);return`<button class="chip ${S.lang==x?'sel':''}" onclick="S.lang='${x}';save();load('${x}');R()">${l[2]} ${l[1]}</button>`}).join('')}</div></div><div class="cd rw"><span>🔔 Notificaciones</span><input type=checkbox ${S.notif?'checked':''} onchange="nt(this.checked)"></div>${dip?'<button class=b onclick="dip.prompt()">📲 Instalar app</button>':'<p class=mu>iPhone: Compartir → Añadir a pantalla de inicio.</p>'}<button class=g onclick="if(confirm('¿Borrar tu progreso?')){S.prog={};save();R()}">🗑️ Borrar progreso</button><button class=g onclick="localStorage.removeItem('cfs');location.reload()">🚪 Cerrar sesión (${esc(S.user)})</button>`}
async function nt(on){if(on&&typeof Notification!='undefined'){S.notif=(await Notification.requestPermission())=='granted';if(S.notif)(await navigator.serviceWorker.ready).showNotification('CodeFlow','¡Notificaciones activadas!')}else S.notif=0;save();R()}
function tg(l){let a=S.langs;if(a.includes(l)){if(S.ok&&a.length==1)return;a.splice(a.indexOf(l),1)}else a.push(l);if(!a.includes(S.lang))S.lang=a[0];save()}
async function hs(p){try{let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cf:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
function auth(m){m.innerHTML=`<div class=ctr style="padding-top:8vh"><div class=lo>{ }</div><h1>CodeFlow</h1><p class=mu>${am?'Crea tu cuenta':'Inicia sesión'}</p></div><input id=au class=in placeholder="Usuario" autocapitalize=off value="${esc(S.tmp||'')}"><br><br><input id=ap class=in type=password placeholder="Contraseña"><p style="color:#ff6b8b;min-height:1.4em">${ae}</p><button class=b onclick=ent()>${am?'Registrarme':'Entrar'}</button><button class=g onclick="am=!am;ae='';R()">${am?'Ya tengo cuenta':'Crear cuenta nueva'}</button>`}
async function ent(){let u=$('#au').value.trim().toLowerCase(),p=$('#ap').value,U=JSON.parse(localStorage.cfp||'{}');ae='';S.tmp=u;
if(u.length<3||p.length<4)ae='Usuario (mín. 3) y contraseña (mín. 4).';else{let h=await hs(p);if(am){if(U[u])ae='Ese usuario ya existe.';else{U[u]=h;localStorage.cfp=JSON.stringify(U)}}else if(U[u]!=h)ae='Usuario o contraseña incorrectos.'}
if(!ae){if(!am)Object.assign(S,JSON.parse(localStorage['cs_'+u]||'{}'));S.user=u;S.name=u;delete S.tmp;localStorage.cfs=u;save()}R()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(T==1&&S.ok)R()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
R();
</script></body></html>
